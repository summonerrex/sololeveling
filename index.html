<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solo Leveling</title>
<meta name="application-name" content="Solo Leveling">
<meta name="apple-mobile-web-app-title" content="Solo Leveling">
<meta name="description" content="Rex 的個人任務系統：每日任務、主線、週回顧與等級。">
<meta name="theme-color" content="#060912">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=2026-10-16.1">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="login-wrap" id="login" hidden>
  <section class="hero login" aria-label="登入">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6l26 26-26 26L6 32z" fill="none" stroke="#2a3c62" stroke-width="1.5"/><path d="M32 16l16 16-16 16-16-16z" fill="#4db8ff" opacity=".18"/><path d="M32 16l16 16-16 16-16-16z" fill="none" stroke="#4db8ff" stroke-width="2"/><circle cx="32" cy="32" r="4" fill="#a8ddff"/></svg>
      <div><strong>Solo Leveling</strong><span>個人任務系統</span></div>
    </div>
    <p class="login-sub">用 Supabase 裡建立的帳號登入。每台裝置只需要登入一次。</p>
    <form id="loginForm" autocomplete="on">
      <label class="fld" for="li-email">Email<input type="email" id="li-email" autocomplete="username" required></label>
      <label class="fld" for="li-pw">密碼<input type="password" id="li-pw" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit" id="li-btn">登入</button>
      <div class="err" id="li-err" role="alert"></div>
    </form>
  </section>
</div>

<div class="shell" id="app" hidden>
  <aside class="rail">
    <section class="hero" id="status" aria-label="角色狀態">
      <span class="mode" id="modeTag" hidden>展示模式</span>
      <div class="hero-top"><div class="dateline" id="resetLine"></div><span class="clock num" id="clock"></span></div>
      <div class="hero-main">
        <div class="ring" role="img" id="ringBox" aria-label="等級進度">
          <svg id="ringSvg" viewBox="0 0 120 120" aria-hidden="true"></svg>
          <div class="ring-c"><b id="lvNum">1</b><span>等級</span></div>
        </div>
        <div class="hero-id">
          <div class="pname"><strong id="pName">PLAYER</strong><span class="rank" id="pRank">E 級</span></div>
          <div class="xpbar" aria-hidden="true"><i id="xpBar"></i></div>
          <div class="xpmeta num" id="xpMeta">正在讀取資料…</div>
          <div class="streak" id="streak"></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="面板分頁">
      <button role="tab" data-act="tab" data-v="today" id="tab-today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><circle cx="12" cy="12" r="2.4"/></svg><span>今日</span></button>
      <button role="tab" data-act="tab" data-v="week" id="tab-week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19V11M9.5 19V6M14.5 19v-9M19.5 19V8"/></svg><span>本週</span></button>
      <button role="tab" data-act="tab" data-v="month" id="tab-month"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9.3 10v10M14.7 10v10M8 3v4M16 3v4"/></svg><span>本月</span></button>
      <button role="tab" data-act="tab" data-v="backlog" id="tab-backlog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16.5l8 4 8-4"/></svg><span>任務庫</span></button>
      <button role="tab" data-act="tab" data-v="rules" id="tab-rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v6c0 4.4-3.1 7.6-7.5 9-4.4-1.4-7.5-4.6-7.5-9V6z"/><path d="M8.8 12.2l2.2 2.2 4.3-4.6"/></svg><span>規則</span></button>
    </nav>
    <section class="railweek" id="railWeek" aria-label="本週每日任務完成情況"></section>
  </aside>

  <div class="main">
    <div id="banner"></div>
    <main id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/app.js?v=2026-10-16.1"></script>
</body>
</html>
